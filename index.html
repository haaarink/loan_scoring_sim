<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fin-Score 스코어링 엔진</title>
  <!-- 폰트 및 아이콘 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<!-- 상단 네비게이션 (핀테크 앱 스타일) -->
<nav class="navbar fin-nav">
  <div class="container max-w-container">
    <a class="navbar-brand fw-bold text-primary fs-4" href="#">
      <i class="bi bi-lightning-charge-fill"></i> FinScore <span class="badge bg-primary-subtle text-primary ms-2 fs-7 rounded-pill">Admin</span>
    </a>
  </div>
</nav>

<div class="container max-w-container py-4">
  
  <!-- 시나리오 프리셋 -->
  <div class="preset-box d-flex flex-wrap align-items-center mb-4">
    <span class="me-3 fw-bold text-muted small"><i class="bi bi-magic"></i> 원클릭 시연:</span>
    <button class="btn btn-preset active" onclick="applyPreset('prime')">🟢 우량 직장인 (자동승인)</button>
    <button class="btn btn-preset" onclick="applyPreset('borderline')">🟡 단기 재직자 (수동심사)</button>
    <button class="btn btn-preset" onclick="applyPreset('cutoff')">🔴 연체 보유자 (즉시거절)</button>
  </div>

  <div class="row g-4">
    <!-- 좌측: 데이터 입력 폼 -->
    <div class="col-lg-7">
      <div class="fin-card">
        <h5 class="fw-bold mb-4">차주 심사 데이터</h5>
        <form id="loanForm">
          
          <div class="section-title">기본 인적사항</div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label">신청자 성명</label>
              <input type="text" id="applicant_name" class="form-control fin-input" value="김민수">
            </div>
            <div class="col-6">
              <label class="form-label">만 나이</label>
              <input type="number" id="age" class="form-control fin-input" value="32">
            </div>
            <div class="col-6">
              <label class="form-label">휴대폰 명의</label>
              <input type="text" id="phone_owner_name" class="form-control fin-input" value="김민수">
            </div>
            <div class="col-6">
              <label class="form-label">입금계좌 명의</label>
              <input type="text" id="account_owner_name" class="form-control fin-input" value="김민수">
            </div>
          </div>

          <div class="section-title">신용 및 연체 정보</div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label">KCB 신용평점</label>
              <input type="number" id="kcb_score" class="form-control fin-input" value="790">
            </div>
            <div class="col-6">
              <label class="form-label">NICE 신용평점</label>
              <input type="number" id="nice_score" class="form-control fin-input" value="830">
            </div>
            <div class="col-6">
              <label class="form-label">현재 연체 건수</label>
              <input type="number" id="current_overdue_count" class="form-control fin-input" value="0">
            </div>
            <div class="col-6">
              <label class="form-label">최근 6개월 연체(일)</label>
              <input type="number" id="recent_6m_overdue_days" class="form-control fin-input" value="0">
            </div>
            <div class="col-12 mt-2">
              <div class="form-check fin-switch">
                <input class="form-check-input" type="checkbox" id="is_public_default">
                <label class="form-check-label fw-semibold text-secondary" for="is_public_default">개인회생 / 신복위 / 채무불이행 등재자</label>
              </div>
            </div>
          </div>

          <div class="section-title">소득 및 재직 (건강보험 기준)</div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label">자격 형태</label>
              <select id="nhic_status" class="form-select fin-input">
                <option value="직장가입자">직장가입자</option>
                <option value="지역가입자">지역가입자</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">재직 기간 (개월)</label>
              <input type="number" id="employment_months" class="form-control fin-input" value="18">
            </div>
            <div class="col-6">
              <label class="form-label">건보료 납부액 (월)</label>
              <input type="number" id="avg_nhic_premium" class="form-control fin-input" value="145000">
            </div>
            <div class="col-6">
              <label class="form-label">급여일 (매월)</label>
              <input type="number" id="payday_day" class="form-control fin-input" value="25">
            </div>
          </div>

          <div class="section-title">기존 부채 현황</div>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label">연간 총소득 (원)</label>
              <input type="number" id="annual_income" class="form-control fin-input" value="45000000">
            </div>
            <div class="col-6">
              <label class="form-label">총 대출 잔액 (원)</label>
              <input type="number" id="total_debt" class="form-control fin-input" value="12000000">
            </div>
            <div class="col-6">
              <label class="form-label">타 대부업 건수</label>
              <input type="number" id="peer_lender_count" class="form-control fin-input" value="0">
            </div>
            <div class="col-6">
              <label class="form-label">당사 완제 이력 (회)</label>
              <input type="number" id="past_repaid_count" class="form-control fin-input" value="1">
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- 우측: 심사 결과 대시보드 -->
    <div class="col-lg-5">
      <div class="sticky-top" style="top: 20px;">
        <div class="fin-card text-center d-flex flex-column justify-content-center min-h-result position-relative">
          
          <!-- 심사 실행 전 기본 상태 -->
          <div id="readyStage">
            <div class="illustration-placeholder mb-3"><i class="bi bi-robot"></i></div>
            <h5 class="fw-bold">AI 룰 엔진 대기 중</h5>
            <p class="text-muted small mb-4">좌측 데이터를 확인 후 심사를 실행해주세요.</p>
          </div>

          <!-- 로딩 화면 (핀테크 스타일) -->
          <div id="loadingStage" class="d-none">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <h6 class="fw-bold">신용 정보 분석 중...</h6>
            <p class="text-muted small">공공 마이데이터 및 KCB 연동 시뮬레이션</p>
          </div>

          <!-- 심사 완료 화면 -->
          <div id="resultStage" class="d-none text-start">
            <div class="text-center mb-4">
              <div id="decisionBadge" class="fin-badge mb-2"></div>
              <div class="score-circle mx-auto my-3" id="scoreCircle">
                <div class="score-value" id="scoreDisplay">0</div>
                <div class="score-label">종합점수</div>
              </div>
            </div>

            <!-- 승인 한도/조건 (통과 시) -->
            <div id="approvedBox" class="result-details bg-light rounded-4 p-3 mb-4 d-none">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">최대 승인 한도</span>
                <span class="fw-bold text-primary">500,000 원</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">급여일 맞춤 만기</span>
                <span class="fw-bold text-dark" id="resDueDate">-</span>
              </div>
              <div class="d-flex justify-content-between">
                <span class="text-muted small">적용 금리</span>
                <span class="fw-semibold text-dark small">연 20.0% (일 0.054%)</span>
              </div>
            </div>

            <!-- 거절 사유 (거절 시) -->
            <div id="rejectedBox" class="alert alert-danger rounded-4 d-none border-0 shadow-sm">
              <div class="fw-bold small mb-2"><i class="bi bi-exclamation-triangle"></i> 즉시 부결 사유</div>
              <ul class="mb-0 ps-3 small text-danger fw-semibold" id="cutoffList"></ul>
            </div>

            <div class="d-grid mt-4">
              <button class="btn btn-outline-secondary rounded-pill" onclick="resetForm()">다시 심사하기</button>
            </div>
          </div>
          
        </div>
        
        <!-- 심사 버튼 (결과화면 밖 하단에 고정) -->
        <button id="submitBtn" class="btn btn-primary fin-btn-primary w-100 mt-3" onclick="startEvaluation()">
          룰 엔진 심사 실행하기
        </button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
